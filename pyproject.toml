[project]
name = "sales-reporting-assistant"
version = "0.1.0"
description = "Beginner-friendly AI-powered sales reporting assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "langgraph>=0.6",
    "langchain>=0.3",
    "langchain-google-genai>=2.1",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "reportlab>=4.4",
    "uvicorn>=0.34",
    "python-dotenv>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
